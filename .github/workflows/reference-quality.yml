name: Reference quality checks
on: [push, pull_request]
jobs:
  reference-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python validation/check_repository.py
      # Raw CSV is intentionally not in Git; CI does not recalculate private data
      # or execute SAS. Reference checks do not imply SAS execution.
